# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# The site is built from two branches: the package source comes from 'main', the
# pkgdown configuration from 'devel-tools', where this workflow lives. The two
# checkouts below put them together in the same working tree
on:
  push:
    branches: [devel-tools]

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      # Package source
      - uses: actions/checkout@v5
        with:
          ref: main

      # '_pkgdown.yaml' was removed from 'main' and is taken from here. 'path'
      # keeps it out of the package root, so nothing stray ends up in the tree
      - uses: actions/checkout@v5
        with:
          ref: devel-tools
          path: .pkgdown-config
          sparse-checkout: |
            _pkgdown.yaml
          sparse-checkout-cone-mode: false

      - name: Restore the pkgdown configuration
        run: cp .pkgdown-config/_pkgdown.yaml . && rm -rf .pkgdown-config
        shell: bash

      - uses: r-lib/actions/setup-pandoc@v2

      # pak resolves the Bioconductor dependencies from biocViews
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
