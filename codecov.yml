comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 80%
        threshold: 5%
        informational: true

ignore:
  - "R/globals.R"
  - "R/consensusRegions-package.R"
  - "inst/**"
  - "vignettes/**"
