# Adapted from https://github.com/r-lib/actions/tree/v2/examples, with the
# Bioconductor repositories and BiocCheck added.
#
# The matrix mirrors the three platforms the Bioconductor build system runs on.
# There is no 'bioc-version' input on setup-r: BiocManager maps the R version onto
# the matching Bioconductor version, so R devel gives Bioconductor devel and R
# release gives Bioconductor release. pak resolves the Bioconductor dependencies
# from biocViews, so no repository has to be declared by hand. BiocCheck runs once,
# on devel, since that is the branch a submission is reviewed against.
name: R-CMD-check-bioc

on:
  push:
    branches: [main, master, devel]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check-bioc:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'devel',   bioccheck: true}
          - {os: ubuntu-latest,   r: 'release', bioccheck: false}
          - {os: macos-latest,    r: 'release', bioccheck: false}
          - {os: windows-latest,  r: 'release', bioccheck: false}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: no
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v5

      # Required to knit the vignette during the check
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # 'Suggests' are installed by default, so ComplexHeatmap, DESeq2, BiocStyle
      # and variancePartition must NOT be repeated here: a package named both in
      # DESCRIPTION and in 'extra-packages' gives pak two direct references to
      # reconcile, which fails
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, bioc::BiocCheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
          args: 'c("--no-manual", "--timings")'
          build_args: 'c("--no-manual")'
          upload-snapshots: true

      # Checks that belong to the repository rather than to the tarball: stray
      # files, unwanted history, oversized objects
      - name: BiocCheckGitClone
        if: matrix.config.bioccheck
        run: BiocCheck::BiocCheckGitClone(".")
        shell: Rscript {0}

      # Drop 'new-package' once the package has been accepted: it turns the
      # version numbering and the support site rules into errors
      - name: BiocCheck
        if: matrix.config.bioccheck
        run: |
          BiocCheck::BiocCheck(
            ".",
            `quit-with-status` = TRUE,
            `new-package` = TRUE
          )
        shell: Rscript {0}
