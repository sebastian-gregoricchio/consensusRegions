# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Started by hand or by the weekly schedule, since the workflows sit on
# 'devel-tools' while the package source stays on 'main'. See the checkout step
on:
  push:
    branches: [devel-tools]
    
name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      # The package source lives on 'main'
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: r-lib/actions/setup-pandoc@v2

      # pak resolves the Bioconductor dependencies from biocViews, so no extra
      # repository setting is needed here
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # 'Suggests' are installed by default, hence the packages needed by the tests
      # (ComplexHeatmap, DESeq2, variancePartition, ...) must NOT be repeated here:
      # a package listed both in DESCRIPTION and in 'extra-packages' gives pak two
      # direct references to reconcile, which currently fails with
      # "$ operator is invalid for atomic vectors".
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            line_exclusions = list(
              "R/globals.R",
              "R/consensusRegions-package.R"
            ),
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)

          ## uncovered lines per file, most affected first. The columns returned by
          ## zero_coverage() differ between covr versions, hence only 'filename' is used and
          ## the whole report is guarded: a diagnostic must never fail the workflow.
          tryCatch({
            zero <- covr::zero_coverage(cov)
            if (nrow(zero) > 0) {
              cat("\nUncovered lines per file:\n")
              print(sort(table(basename(as.character(zero$filename))), decreasing = TRUE))
            } else {
              cat("\nNo uncovered line.\n")
            }
          }, error = function(e) {message("Could not summarize the uncovered lines: ", conditionMessage(e))})

          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v5
        with:
          # No pull request reaches this workflow any more, so the run fails on error
          # whenever the token is available
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
